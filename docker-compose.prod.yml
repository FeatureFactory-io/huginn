# Production Docker Compose — consumed by AWS Elastic Beanstalk.
# ECR_IMAGE is substituted by scripts/deploy.sh (envsubst) before bundling.
# All other ${VAR} values are provided by EB environment properties at runtime.
#
# NOTE: No 'db' service here — production uses RDS PostgreSQL.
# POSTGRES_HOST is set as an EB environment property pointing to the RDS endpoint.

services:
  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${ECR_IMAGE}
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn huginn.wsgi:application
               --bind 0.0.0.0:8000
               --workers 2
               --timeout 60
               --access-logfile -"
    ports:
      - "80:8000"
    environment:
      DJANGO_SETTINGS_MODULE: huginn.settings.production
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      GITLAB_URL: ${GITLAB_URL}
      GITLAB_TOKEN: ${GITLAB_TOKEN}
      JIRA_URL: ${JIRA_URL}
      JIRA_USER: ${JIRA_USER}
      JIRA_TOKEN: ${JIRA_TOKEN}
    depends_on:
      redis:
        condition: service_healthy

  worker:
    image: ${ECR_IMAGE}
    restart: always
    command: celery -A huginn worker --loglevel=info --concurrency=2
    environment:
      DJANGO_SETTINGS_MODULE: huginn.settings.production
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      GITLAB_URL: ${GITLAB_URL}
      GITLAB_TOKEN: ${GITLAB_TOKEN}
      JIRA_URL: ${JIRA_URL}
      JIRA_USER: ${JIRA_USER}
      JIRA_TOKEN: ${JIRA_TOKEN}
    depends_on:
      redis:
        condition: service_healthy

  beat:
    image: ${ECR_IMAGE}
    restart: always
    command: celery -A huginn beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: huginn.settings.production
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
