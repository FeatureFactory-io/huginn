# Production Docker Compose — consumed by AWS Elastic Beanstalk.
# ECR_IMAGE is substituted by scripts/deploy-staging.sh (envsubst) before bundling.
#
# NOTE: No 'db' service — production uses RDS PostgreSQL.
# EB exports all environment properties as shell env vars before running docker
# compose, so ${VAR} substitution here is satisfied automatically at deploy time.

services:
  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${ECR_IMAGE}
    restart: always
    command: "sh -c 'python manage.py reset_schema_if_requested && python manage.py migrate --noinput && gunicorn huginn.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60 --access-logfile -'"
    ports:
      - "8080:8000"
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      HUGINN_RESET_DB: ${HUGINN_RESET_DB:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      EXTRA_CSRF_ORIGINS: ${EXTRA_CSRF_ORIGINS:-}
    depends_on:
      redis:
        condition: service_healthy

  worker:
    image: ${ECR_IMAGE}
    restart: always
    command: celery -A huginn worker --loglevel=info --concurrency=2
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE}
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      EXTRA_CSRF_ORIGINS: ${EXTRA_CSRF_ORIGINS:-}
    depends_on:
      redis:
        condition: service_healthy

  beat:
    image: ${ECR_IMAGE}
    restart: always
    command: celery -A huginn beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE}
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      redis:
        condition: service_healthy
