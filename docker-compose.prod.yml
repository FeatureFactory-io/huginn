# Production Docker Compose — consumed by AWS Elastic Beanstalk.
# ECR_IMAGE is substituted by scripts/deploy.sh (envsubst) before bundling.
#
# NOTE: No 'db' service — production uses RDS PostgreSQL.
# All runtime config (POSTGRES_HOST, SECRET_KEY, etc.) is injected via
# EB environment properties, which EB writes to /opt/elasticbeanstalk/deployment/env.
# Each service loads that file with env_file so no ${VAR} substitution is needed.

services:
  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${ECR_IMAGE}
    restart: always
    command: "sh -c 'python manage.py migrate --noinput && gunicorn huginn.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60 --access-logfile -'"
    ports:
      - "8080:8000"
    env_file:
      - /opt/elasticbeanstalk/deployment/env
    depends_on:
      redis:
        condition: service_healthy

  worker:
    image: ${ECR_IMAGE}
    restart: always
    command: celery -A huginn worker --loglevel=info --concurrency=2
    env_file:
      - /opt/elasticbeanstalk/deployment/env
    depends_on:
      redis:
        condition: service_healthy

  beat:
    image: ${ECR_IMAGE}
    restart: always
    command: celery -A huginn beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - /opt/elasticbeanstalk/deployment/env
    depends_on:
      redis:
        condition: service_healthy
