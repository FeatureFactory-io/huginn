stages:
  - lint
  - test
  - build
  - deploy

variables:
  PYTHON_IMAGE: python:3.12-slim

# ──────────────────────────────────────────────────────────────
# LINT  — every push, every branch
# ──────────────────────────────────────────────────────────────
lint:
  stage: lint
  image: $PYTHON_IMAGE
  before_script:
    - pip install ruff --quiet
  script:
    - ruff check .
    - ruff format --check .

# ──────────────────────────────────────────────────────────────
# TEST  — every push, every branch
# ──────────────────────────────────────────────────────────────
test:
  stage: test
  image: $PYTHON_IMAGE
  services:
    - name: postgres:16-alpine
      alias: db
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: huginn
    POSTGRES_USER: huginn
    POSTGRES_PASSWORD: huginn
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    DJANGO_SETTINGS_MODULE: huginn.settings.local
    SECRET_KEY: ci-test-secret-key-not-used-in-prod
    DEBUG: "True"
    ALLOWED_HOSTS: localhost
  before_script:
    - pip install -r requirements.txt --quiet
  script:
    - pytest --tb=short -q

# ──────────────────────────────────────────────────────────────
# BUILD — main branch only
# Builds Docker image, pushes to ECR with :sha and :latest tags
# ──────────────────────────────────────────────────────────────
build:
  stage: build
  image: docker:26
  services:
    - docker:26-dind
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION
      | docker login --username AWS --password-stdin $ECR_REGISTRY
  script:
    - docker build
        -t $ECR_REGISTRY/huginn:$CI_COMMIT_SHORT_SHA
        -t $ECR_REGISTRY/huginn:latest .
    - docker push $ECR_REGISTRY/huginn:$CI_COMMIT_SHORT_SHA
    - docker push $ECR_REGISTRY/huginn:latest

# ──────────────────────────────────────────────────────────────
# DEPLOY — main branch only, after build
# Deploys to the inactive EB env, then smoke-tests it.
# The 'swap' job below is the manual gate to promote to prod.
# ──────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  image: $PYTHON_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs: [build]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends
        curl gettext-base zip awscli 2>/dev/null
      || pip install awscli --quiet  # fallback for slim images that lack apt
  script:
    - bash scripts/deploy.sh
  environment:
    name: staging

# ──────────────────────────────────────────────────────────────
# SWAP  — manual gate (you click this)
# Calls eb swap to rotate huginn-prod CNAME from inactive to live.
# Route53 huginn.featurefactory.io → huginn-prod.* never changes.
# ──────────────────────────────────────────────────────────────
swap:
  stage: deploy
  image: $PYTHON_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  needs: [deploy]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends awscli 2>/dev/null
      || pip install awscli --quiet
  script:
    - |
      BLUE_CNAME=$(aws elasticbeanstalk describe-environments \
        --application-name "$EB_APP_NAME" \
        --environment-names "$EB_BLUE_ENV" \
        --query 'Environments[0].CNAME' --output text)

      if echo "$BLUE_CNAME" | grep -q "huginn-prod"; then
        INACTIVE_ENV="$EB_GREEN_ENV"
        LIVE_ENV="$EB_BLUE_ENV"
      else
        INACTIVE_ENV="$EB_BLUE_ENV"
        LIVE_ENV="$EB_GREEN_ENV"
      fi

      echo "Swapping $INACTIVE_ENV (staging) → $LIVE_ENV (prod)"
      aws elasticbeanstalk swap-environment-cnames \
        --source-environment-name "$INACTIVE_ENV" \
        --destination-environment-name "$LIVE_ENV"

      echo "Swap complete. huginn.featurefactory.io now serves $INACTIVE_ENV."
  environment:
    name: production
