stages:
  - lint
  - test
  - infra
  - build
  - deploy

variables:
  PYTHON_IMAGE: python:3.12-slim

# ──────────────────────────────────────────────────────────────
# LINT  — every push, every branch
# ──────────────────────────────────────────────────────────────
lint:
  stage: lint
  image: $PYTHON_IMAGE
  before_script:
    - pip install ruff --quiet
  script:
    - ruff check .
    - ruff format --check .

# ──────────────────────────────────────────────────────────────
# TEST  — every push, every branch
# ──────────────────────────────────────────────────────────────
test:
  stage: test
  image: $PYTHON_IMAGE
  variables:
    SECRET_KEY: ci-test-secret-key-not-used-in-prod
    PYTHONPATH: "."
  before_script:
    # aws-cdk / jsii synth tests need a Node.js runtime during pytest collection
    - apt-get update -qq && apt-get install -y -qq nodejs
    - pip install -r requirements.txt --quiet
  script:
    - pytest --tb=short -q

# ──────────────────────────────────────────────────────────────
# INFRA — trigger child pipeline when infra/ changes (main only)
# The child pipeline (infra/gitlab-ci.yml) runs CDK test/diff/deploy.
# Remove `strategy: depend` until the infra pipeline is stable, then
# re-enable so infra failures block the app pipeline.
# ──────────────────────────────────────────────────────────────
infra-pipeline:
  stage: infra
  trigger:
    include: infra/gitlab-ci.yml
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - infra/**/*

# ──────────────────────────────────────────────────────────────
# BUILD — main branch only
# Uses kaniko (no Docker daemon, no DinD, ECR auth via AWS env vars)
# ──────────────────────────────────────────────────────────────
build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}"
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
        --destination "${ECR_REGISTRY}/huginn:${CI_COMMIT_SHORT_SHA}"
        --destination "${ECR_REGISTRY}/huginn:latest"

# ──────────────────────────────────────────────────────────────
# DEPLOY — main branch only, after build
# Deploys to the inactive EB env, then smoke-tests it.
# The 'swap' job below is the manual gate to promote to prod.
# ──────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  image: $PYTHON_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs: [build]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl unzip gettext-base zip
    - curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
    - unzip -q /tmp/awscliv2.zip -d /tmp && /tmp/aws/install
  script:
    - bash scripts/deploy.sh
  environment:
    name: staging

# ──────────────────────────────────────────────────────────────
# SWAP  — manual gate (you click this)
# Calls eb swap to rotate huginn-prod CNAME from inactive to live.
# Route53 huginn.featurefactory.io → huginn-prod.* never changes.
# ──────────────────────────────────────────────────────────────
swap:
  stage: deploy
  image: $PYTHON_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  needs: [deploy]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl unzip
    - curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
    - unzip -q /tmp/awscliv2.zip -d /tmp && /tmp/aws/install
  script:
    - |
      BLUE_CNAME=$(aws elasticbeanstalk describe-environments \
        --application-name "$EB_APP_NAME" \
        --environment-names "$EB_BLUE_ENV" \
        --query 'Environments[0].CNAME' --output text)

      if echo "$BLUE_CNAME" | grep -q "huginn-prod"; then
        INACTIVE_ENV="$EB_GREEN_ENV"
        LIVE_ENV="$EB_BLUE_ENV"
      else
        INACTIVE_ENV="$EB_BLUE_ENV"
        LIVE_ENV="$EB_GREEN_ENV"
      fi

      echo "Swapping $INACTIVE_ENV (staging) → $LIVE_ENV (prod)"
      aws elasticbeanstalk swap-environment-cnames \
        --source-environment-name "$INACTIVE_ENV" \
        --destination-environment-name "$LIVE_ENV"

      echo "Swap complete. huginn.featurefactory.io now serves $INACTIVE_ENV."
  environment:
    name: production
