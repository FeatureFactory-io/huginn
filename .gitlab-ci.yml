# App release pipeline: workflow + runner images only. Work lives in Makefile + scripts/.
# Flow: tag x.y.z on main → push branch release/x.y.z at same commit → pipeline runs
# validate → lint → test → (optional infra child) → build → staging → GitLab Release → manual promote.
#
# Targets: make verify-release | ci-lint | ci-test | ci-staging-deploy | gitlab-release | ci-promote
# Kaniko executor has no bash; build uses POSIX sh scripts. Release-cli builds use bash where available.

stages:
  - validate
  - lint
  - test
  - infra
  - build
  - deploy
  - release
  - promote

variables:
  PYTHON_IMAGE: python:3.12-slim
  GIT_DEPTH: "0"

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\/[0-9]+\.[0-9]+\.[0-9]+$/

.verify-job: &verify-job
  stage: validate
  image: alpine:3.19
  before_script:
    - apk add --no-cache git bash grep make
  script:
    - make verify-release

verify_release_branch:
  <<: *verify-job

.python-with-make: &python-with-make
  image: $PYTHON_IMAGE
  before_script:
    - apt-get update -qq && apt-get install -y -qq make

lint:
  stage: lint
  <<: *python-with-make
  script:
    - make ci-lint

test:
  stage: test
  <<: *python-with-make
  variables:
    SECRET_KEY: ci-test-secret-key-not-used-in-prod
    PYTHONPATH: "."
  script:
    - make ci-test

infra-pipeline:
  stage: infra
  trigger:
    include: infra/gitlab-ci.yml
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\/[0-9]+\.[0-9]+\.[0-9]+$/
      changes:
        - infra/**/*

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - sh scripts/ci-kaniko-build.sh

deploy_staging:
  stage: deploy
  <<: *python-with-make
  needs: [build]
  script:
    - make ci-staging-deploy
  artifacts:
    reports:
      dotenv: staging.env
  environment:
    name: staging
    url: $STAGING_URL

create_release:
  stage: release
  image:
    name: registry.gitlab.com/gitlab-org/release-cli:latest
    entrypoint: [""]
  needs: [deploy_staging]
  script:
    - sh scripts/ci-create-gitlab-release.sh

promote_production:
  stage: promote
  <<: *python-with-make
  when: manual
  needs: [create_release]
  script:
    - make ci-promote
  environment:
    name: production
    url: https://huginn.featurefactory.io
