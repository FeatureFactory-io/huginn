[project]
name = "huginn"
version = "2026.05.05"
requires-python = ">=3.12"
description = "Human-AI OODA composite for engineering PMs"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/settings/*.py" = ["F405", "F403"]
"*/migrations/*.py" = ["N806", "E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "huginn.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-v --tb=short"
log_cli = true
log_cli_level = "INFO"
