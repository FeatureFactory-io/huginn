{% extends "base_mockups.html" %}

{% block title %}Edit Situational Awareness{% endblock %}

{% block content %}
{% include "ui/mockups/_screen_anchor.html" with screen_id="SITAWARENESS-EDIT-1" screen_testid="sitawareness-edit-loaded" %}

<section class="hg-page-header rounded-2 mb-3 d-flex flex-wrap align-items-center justify-content-between gap-3">
  <div class="flex-grow-1">
    <h1 class="hg-page-title d-flex align-items-center gap-2 mb-0 flex-wrap">
      <i class="fa-solid fa-map-location-dot text-primary" aria-hidden="true"></i>
      <span>Edit Situational Awareness</span>
    </h1>
  </div>
</section>

<form class="row g-4">
  <div class="col-xl-9">
    <label class="form-label">Standing context</label>
    <textarea class="form-control mb-4" rows="6">Standing...</textarea>
    <label class="form-label">Active situations</label>
    <textarea class="form-control mb-4" rows="5">Situations...</textarea>
    <label class="form-label" for="mock-sitawareness-change-summary">Change summary <span class="text-danger">*</span></label>
    <input id="mock-sitawareness-change-summary"
           class="form-control"
           type="text"
           placeholder="what changed in this version?"
           autocomplete="off"
           data-testid="sitawareness-edit-change-summary">
    <div class="d-flex justify-content-end mt-4 gap-2">
      <a class="btn btn-outline-secondary" href="{% url 'mockup-sitawareness-view' %}" data-testid="sitawareness-edit-cancel">
        <i class="fa-solid fa-xmark me-1" aria-hidden="true"></i> Cancel
      </a>
      <button type="button" class="btn btn-primary disabled" data-testid="sitawareness-edit-save">
        <i class="fa-solid fa-floppy-disk me-1" aria-hidden="true"></i> Save Version
      </button>
    </div>
  </div>
</form>
{% endblock %}
