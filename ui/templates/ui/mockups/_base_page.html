{# Page header row for mockups — no Django blocks inside includes #}
{% comment %} Expected: title, subtitle (optional), badge (optional) {% endcomment %}
<section class="hg-page-header rounded-2 mb-3 d-flex flex-wrap justify-content-between align-items-start gap-2">
  <div>
    {% if badge %}
      <span class="badge bg-secondary rounded-pill me-2" data-testid="page-badge">{{ badge }}</span>
    {% endif %}
    <h1 class="hg-page-title d-inline" data-testid="page-title">{{ title }}</h1>
    {% if subtitle %}
      <p class="text-muted mb-0 mt-1 small">{{ subtitle }}</p>
    {% endif %}
  </div>
</section>
