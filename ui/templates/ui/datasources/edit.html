{% extends "base.html" %}
{% block title %}Edit {{ datasource.name }}{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Edit Data Source</h1>
{% if form_error %}
  <div class="alert alert-warning">{{ form_error }}</div>
{% endif %}
<form method="post" style="max-width:520px;">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label" for="id_name">Name</label>
    <input id="id_name" name="name" class="form-control" value="{{ datasource.name }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="id_base_url">Base URL</label>
    <input id="id_base_url" name="base_url" type="url" class="form-control" value="{{ datasource.base_url }}" required>
  </div>
  <button type="submit" class="btn btn-primary" data-testid="datasource-save">Save</button>
  <a href="{% url 'datasource-detail' pk=datasource.pk %}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
