{% extends "base.html" %}
{% block title %}Delete {{ datasource.name }}{% endblock %}
{% block content %}
<h1 class="h5 text-danger">Delete data source?</h1>
<p>{{ datasource.name }}</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger" data-testid="confirm-delete-datasource">Delete</button>
  <a href="{% url 'datasource-detail' pk=datasource.pk %}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
