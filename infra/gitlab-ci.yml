# Huginn infrastructure pipeline — runs as a GitLab child pipeline.
# Triggered from .gitlab-ci.yml when infra/** files change, or manually from GitLab UI.
#
# Stages:
#   test   — CDK assertion tests (no AWS calls, no credentials needed)
#   diff   — cdk diff vs deployed state (informational, non-blocking)
#   deploy — cdk deploy (manual gate, CDK_STACK variable selects the stack)
#
# Required GitLab CI variables (project-level, same as app pipeline):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION

stages:
  - test
  - diff
  - deploy

variables:
  PYTHON_IMAGE: python:3.12-slim

# Reusable setup: install Node.js (CDK CLI) + CDK Python library.
# CDK CLI is a Node package; aws-cdk-lib shells out to it.
.cdk-setup: &cdk-setup
  image: $PYTHON_IMAGE
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends nodejs npm > /dev/null 2>&1
    - npm install -g aws-cdk --quiet
    - pip install -r infra/requirements.txt --quiet

# ── TEST — CDK assertion tests ────────────────────────────────────────────────
# Synthesises each stack in-memory and asserts on the CloudFormation template.
# No AWS credentials needed — all lookups are mocked in test fixtures.
infra-test:
  stage: test
  image: $PYTHON_IMAGE
  before_script:
    - pip install -r infra/requirements.txt --quiet
    - pip install pytest --quiet
  variables:
    PYTHONPATH: "."
  script:
    - pytest tests/infra/ --tb=short -q

# ── DIFF — show what CDK would change ─────────────────────────────────────────
# Non-blocking: cdk diff exits non-zero when there are changes (that's normal).
infra-diff:
  stage: diff
  <<: *cdk-setup
  script:
    - cd infra && cdk diff || true
  allow_failure: true

# ── DEPLOY — manual gate ───────────────────────────────────────────────────────
# Override CDK_STACK in the GitLab UI "Run pipeline" dialog to select which
# stack to deploy:
#   HuginnCdn      — Phase 1 (default): ACM + CloudFront + Route53
#   HuginnNetwork  — Phase 3: VPC + subnets + security groups
#   HuginnData     — Phase 3: RDS + SSM stubs
#   HuginnApp      — Phase 4: ECR + EB + IAM + CloudWatch
#   --all          — all stacks (use with caution)
infra-deploy:
  stage: deploy
  <<: *cdk-setup
  when: manual
  variables:
    CDK_STACK: "HuginnCdn"
  script:
    - cd infra && cdk deploy $CDK_STACK --require-approval never
  environment:
    name: infrastructure
